name: Validate webOS app

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Validate project metadata
        id: metadata
        run: npm run validate

      - name: Install locked development tools
        run: npm ci --no-audit --no-fund

      - name: Install locked on-device chat dependency
        run: npm ci --prefix service --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run unit and browser tests
        run: npm test

      - name: Package and inspect IPK with official webOS CLI (tv)
        run: npm run package

      - name: Upload validation artifact (no Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kickleaf-ipk-validation
          path: ${{ steps.metadata.outputs.ipk }}
          if-no-files-found: error
          retention-days: 7
