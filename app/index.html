<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KickTV PoC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body tabindex="-1">
  <main id="home" class="home">
    <form id="channel-form" novalidate>
      <input id="channel" type="text" placeholder="Nome do canal da Kick" aria-label="Nome do canal da Kick" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="256">
      <button id="watch" type="submit">Assistir</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <div id="player-container" hidden></div>
  <p id="notice" class="notice" role="status" hidden></p>
  <script src="channel.js"></script>
  <script src="app.js"></script>
</body>
</html>
